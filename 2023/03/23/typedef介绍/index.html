<p><em><strong>typedef解释</strong></em></p>
<figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br></pre></td><td class="code"><pre><span class="line"><span class="class"><span class="keyword">struct</span> <span class="title">node</span>&#123;</span></span><br><span class="line">    <span class="type">int</span> data;</span><br><span class="line">    <span class="class"><span class="keyword">struct</span> <span class="title">node</span> *<span class="title">link</span>;</span></span><br><span class="line">&#125;<span class="comment">//通常使用这种方法创建链表结点，但是每次使用&quot;结点&quot;，我们都需要敲出&quot;struct node&quot;</span></span><br><span class="line"> <span class="comment">//同样，使用自引用指针需要&quot;struct node *&quot;，非常的麻烦，而且在一个c语言文件中不只有一类结点时非常混乱</span></span><br></pre></td></tr></table></figure>
<p>基于此我们引入&quot;typedef&quot;,typedef 类似于重命名操作，和&quot;define&quot;非常相似</p>
<figure class="highlight c"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">define</span> max 1000 <span class="comment">//这里我们把max&quot;转换&quot;成1000(本人菜菜，想不到专业的话来解释，因此使用“转换”一词)</span></span></span><br><span class="line"><span class="keyword">typedef</span> <span class="type">int</span> elementType <span class="comment">//这里我们使用 typedef 重命名 int 为 elementType</span></span><br><span class="line"><span class="comment">//typedef 的作用对象一般是&quot;类型&quot;，</span></span><br><span class="line">    <span class="comment">//类型包含系统自带的类型：char, short, int, long, long long, float, double等等</span></span><br><span class="line">    <span class="comment">//也包含用户自定义的类型：结构体</span></span><br><span class="line"><span class="comment">//考虑链表结点的创建</span></span><br><span class="line"><span class="class"><span class="keyword">struct</span> <span class="title">node</span>&#123;</span></span><br><span class="line">    <span class="type">int</span> data;</span><br><span class="line">    <span class="class"><span class="keyword">struct</span> <span class="title">node</span> *<span class="title">link</span>;</span></span><br><span class="line">&#125;<span class="comment">//这里的struct node就是用户自定义类型，因此可以使用typedef进行&quot;改名&quot;操作</span></span><br><span class="line"><span class="keyword">typedef</span> <span class="class"><span class="keyword">struct</span> <span class="title">node</span>&#123;</span></span><br><span class="line">    <span class="type">int</span> data;</span><br><span class="line">    <span class="class"><span class="keyword">struct</span> <span class="title">node</span> *<span class="title">link</span>;</span><span class="comment">//到这一步还未完成重命名操作，因此不可以用重命名之后的指针来替换struct node *</span></span><br><span class="line">&#125;Node,*Nodeptr;<span class="comment">//一般把重命名的名字写在大括号后面。</span></span><br><span class="line"><span class="comment">//这里的操作可以解释为以下两条语句</span></span><br><span class="line"><span class="keyword">typedef</span> <span class="class"><span class="keyword">struct</span> <span class="title">node</span> <span class="title">Node</span>;</span><span class="comment">//Node 表示struct node</span></span><br><span class="line"><span class="keyword">typedef</span> <span class="class"><span class="keyword">struct</span> <span class="title">node</span> * <span class="title">Nodeptr</span>;</span><span class="comment">//Nodeptr 表示struct node *</span></span><br><span class="line"><span class="comment">//考虑如下代码</span></span><br><span class="line"><span class="type">int</span> *a, b;<span class="comment">//这里的a是int*型的指针，而b是int整型</span></span><br><span class="line"><span class="class"><span class="keyword">struct</span> <span class="title">node</span> *<span class="title">a</span>, <span class="title">b</span>;</span><span class="comment">//这里a是struct node *型的指针，b却是自定义类型struct node;</span></span><br><span class="line">Nodeptr a, b;<span class="comment">//这里用Nodeptr表示struct node *,不是简单的替换关系，a和b都是struct node* 型的指针。</span></span><br></pre></td></tr></table></figure>
</li>
</ul>
